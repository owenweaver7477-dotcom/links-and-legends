# Render blueprint — push this repo to GitHub, then on render.com:
#   New  ->  Blueprint  ->  pick the repo.  Free tier is fine.
services:
  - type: web
    name: links-and-legends
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # WITHOUT THIS, careers and course records live on Render's disk, which
      # is wiped on every deploy. Render prompts for the value when you first
      # apply the blueprint; paste your Postgres connection string in.
      #
      # On Supabase use the SESSION POOLER string, not the direct one — Render
      # is IPv4-only and Supabase's direct host resolves to IPv6. Check it
      # took by opening /healthz: it reports "persistent": true.
      - key: DATABASE_URL
        sync: false
