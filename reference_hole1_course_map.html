<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hole 1 — Course Map</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0c1512; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  canvas.hovering { cursor:pointer; }

  /* HUD */
  .hud { position:absolute; top:16px; left:16px; z-index:5;
    background:rgba(12,20,17,.72); backdrop-filter:blur(9px);
    border:1px solid rgba(255,255,255,.10); border-radius:14px;
    padding:12px 15px; color:#eaf3ec; box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .hud .h1 { font-size:19px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:8px; }
  .hud .dot { width:8px; height:8px; border-radius:50%; background:#8fe07a; box-shadow:0 0 8px #8fe07a; }
  .hud .meta { margin-top:4px; font-size:12.5px; color:#a9c2ae; }
  .hud .meta b { color:#dfeee1; font-weight:600; }

  /* legend */
  .legend { position:absolute; top:16px; right:16px; z-index:5;
    background:rgba(12,20,17,.72); backdrop-filter:blur(9px);
    border:1px solid rgba(255,255,255,.10); border-radius:14px;
    padding:11px 13px; color:#dbe8dd; box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .legend h4 { font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:#8fa694; margin-bottom:7px; font-weight:700;}
  .legend .row { display:flex; align-items:center; gap:9px; font-size:12.5px; margin:5px 0; }
  .legend .sw { width:15px; height:15px; border-radius:4px; flex:0 0 auto; border:1px solid rgba(0,0,0,.25);}

  /* controls */
  .controls { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:6;
    display:flex; gap:8px; align-items:center;
    background:rgba(12,20,17,.74); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.10); border-radius:15px; padding:8px;
    box-shadow:0 10px 34px rgba(0,0,0,.5); }
  .btn { border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.045);
    color:#e8f2ea; font-size:13px; font-weight:600; padding:9px 14px; border-radius:10px;
    cursor:pointer; transition:.16s; white-space:nowrap; display:flex; align-items:center; gap:7px;}
  .btn:hover { background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.24); }
  .btn.active { background:#3f9d54; border-color:#4fb767; color:#fff; box-shadow:0 0 0 1px rgba(79,183,103,.4);}
  .btn svg { width:15px; height:15px; }

  /* flyover progress */
  .progress { position:absolute; bottom:74px; left:50%; transform:translateX(-50%); z-index:6;
    width:min(440px,72vw); height:5px; border-radius:3px; background:rgba(255,255,255,.14);
    overflow:hidden; opacity:0; transition:opacity .3s; pointer-events:none;}
  .progress.show { opacity:1; }
  .progress .bar { height:100%; width:0%; background:linear-gradient(90deg,#5fd07a,#9be88a); border-radius:3px;}
  .flylabel { position:absolute; bottom:86px; left:50%; transform:translateX(-50%); z-index:6;
    color:#dff3e2; font-size:12.5px; letter-spacing:.4px; opacity:0; transition:opacity .3s;
    text-shadow:0 1px 6px rgba(0,0,0,.7); pointer-events:none; }
  .flylabel.show { opacity:1; }

  /* tooltip */
  .tip { position:absolute; z-index:8; pointer-events:none; transform:translate(-50%,calc(-100% - 14px));
    background:rgba(10,17,14,.92); color:#eef6ef; border:1px solid rgba(255,255,255,.14);
    padding:7px 11px; border-radius:9px; font-size:12.5px; white-space:nowrap; opacity:0;
    transition:opacity .12s; box-shadow:0 6px 22px rgba(0,0,0,.5); }
  .tip.show { opacity:1; }
  .tip .t { font-weight:700; } .tip .s { color:#a7c0ac; font-size:11px; margin-top:1px;}
  .tip::after{ content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:rgba(10,17,14,.92); }

  /* banner (next hole) */
  .banner { position:absolute; top:18px; left:50%; transform:translate(-50%,-140%); z-index:9;
    background:linear-gradient(90deg,#2f7d43,#49a862); color:#fff; font-weight:700; font-size:14px;
    padding:11px 20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    display:flex; align-items:center; gap:9px; transition:transform .45s cubic-bezier(.22,1,.36,1); }
  .banner.show { transform:translate(-50%,0); }

  .hint { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); z-index:5;
    color:#9fb8a4; font-size:12px; letter-spacing:.3px; opacity:.9; text-shadow:0 1px 5px rgba(0,0,0,.6);}
  @media (max-width:640px){ .legend{ display:none;} .hint{display:none;} .btn{padding:9px 11px; font-size:12px;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="h1"><span class="dot"></span>Hole 1</div>
    <div class="meta"><b>Par 5</b> &nbsp;·&nbsp; <b>541</b> yds &nbsp;·&nbsp; Dogleg <b>right</b></div>
  </div>

  <div class="legend">
    <h4>Legend</h4>
    <div class="row"><span class="sw" style="background:#6aa84f"></span>Fairway</div>
    <div class="row"><span class="sw" style="background:#3f6b32"></span>Rough / trees</div>
    <div class="row"><span class="sw" style="background:#2b8fa6"></span>Water</div>
    <div class="row"><span class="sw" style="background:#e3cf9c"></span>Sand</div>
    <div class="row"><span class="sw" style="background:#cfcabb"></span>Cart path → Hole 2</div>
    <div class="row"><span class="sw" style="background:#e8443a"></span>Pin / hole</div>
  </div>

  <div class="banner" id="banner">🛺&nbsp; Following the cart path to Hole 2 →</div>

  <div class="hint" id="hint">Hover features for info · click the cart path to travel to Hole 2</div>

  <div class="flylabel" id="flylabel"></div>
  <div class="progress" id="progress"><div class="bar" id="bar"></div></div>

  <div class="controls">
    <button class="btn" id="flyBtn" title="Cinematic flyover">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Flyover</button>
    <button class="btn" id="lineBtn" title="Show the ideal line of play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 20 Q10 4 21 12" stroke-dasharray="2 3"/></svg>Ideal line</button>
    <button class="btn active" id="labelBtn" title="Toggle labels">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v3H3zM3 10h12v3H3zM3 15h18v3H3z"/></svg>Labels</button>
    <button class="btn" id="resetBtn" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>Reset</button>
  </div>

  <div class="tip" id="tip"><div class="t"></div><div class="s"></div></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const tip = document.getElementById('tip');
  const banner = document.getElementById('banner');
  const WORLD = { w:1400, h:1820 };
  let DPR = Math.min(window.devicePixelRatio||1, 2);
  let CW=0, CH=0;
  const sc = document.createElement('canvas');      // screen-sized static cache
  const sctx = sc.getContext('2d');
  let backdropGrad=null, vignetteGrad=null, lastViewKey='';

  /* ---------- feature geometry (world coords, faithful to the sketch) ---------- */
  const fairwayPts = [
    [316,466],[300,558],[356,820],[470,1086],[642,1238],
    [816,1176],[886,974],[906,770],[950,566],[1016,442],[1092,372]
  ];
  const FAIRW = 176;                        // fairway width
  const tee    = { x:268, y:430, w:140, h:90 };
  const green  = { x:1140, y:372, r:118 };
  const pin    = { x:1150, y:352 };
  const bunker = { x:1002, y:398, rx:98, ry:66 };
  const pondL  = { x:576, y:558, rx:150, ry:112 };
  const waterR = { x:1246, y:812, rx:120, ry:252 };
  const cartPts = [[-40,206],[320,190],[720,202],[1060,186],[1440,204]];
  const CARTW  = 86;

  // build Path2D helpers
  const fairwayPath = smoothPath(fairwayPts);
  const cartPath    = smoothPath(cartPts);

  function smoothPath(pts){
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      p.quadraticCurveTo(a[0],a[1],mx,my);
    }
    p.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    return p;
  }

  /* ---------- trees (scattered once, in masses that frame the fairway) ---------- */
  const treeClusters = [
    {x:296,y:812,rx:250,ry:330,n:46},   // left arm exterior
    {x:250,y:556,rx:168,ry:170,n:14},   // upper-left near tee/pond
    {x:726,y:906,rx:266,ry:300,n:48},   // centre island (inside the U)
    {x:1086,y:706,rx:150,ry:262,n:22},  // right side, above right water
    {x:520,y:1410,rx:330,ry:180,n:26},  // bottom fringe
    {x:1120,y:560,rx:120,ry:120,n:10}   // upper-right fringe
  ];
  let trees=[];
  function buildTrees(){
    trees=[];
    const test = document.createElement('canvas').getContext('2d');
    for(const cl of treeClusters){
      let placed=0, guard=0;
      while(placed<cl.n && guard<cl.n*40){
        guard++;
        const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random());
        const x=cl.x+Math.cos(a)*cl.rx*rr, y=cl.y+Math.sin(a)*cl.ry*rr;
        if(x<24||x>WORLD.w-8||y<250||y>WORLD.h-20) continue;
        // reject on fairway / green / water / sand / tee / cart
        test.lineWidth=FAIRW+34;
        if(test.isPointInStroke(fairwayPath,x,y)) continue;
        if(dist(x,y,green.x,green.y)<green.r+30) continue;
        if(inEllipse(x,y,bunker,26)) continue;
        if(inEllipse(x,y,pondL,24)) continue;
        if(inEllipse(x,y,waterR,24)) continue;
        if(x>tee.x-70&&x<tee.x+tee.w+70&&y>tee.y-70&&y<tee.y+tee.h+70) continue;
        test.lineWidth=CARTW+40;
        if(test.isPointInStroke(cartPath,x,y)) continue;
        trees.push({x,y,r:16+Math.random()*15, tone:Math.random()});
        placed++;
      }
    }
    trees.sort((a,b)=>a.y-b.y);
  }
  const dist=(x,y,a,b)=>Math.hypot(x-a,y-b);
  const inEllipse=(x,y,e,pad=0)=>((x-e.x)**2)/((e.rx+pad)**2)+((y-e.y)**2)/((e.ry+pad)**2)<=1;

  /* ---------- static base render (drawn once to an offscreen canvas) ---------- */
  let base=null, noiseTile=null;
  function makeNoiseTile(){
    const n=document.createElement('canvas'); n.width=n.height=140;
    const nc=n.getContext('2d'); const img=nc.createImageData(140,140);
    for(let i=0;i<img.data.length;i+=4){
      const v=180+Math.random()*75; img.data[i]=img.data[i+1]=img.data[i+2]=v;
      img.data[i+3]=Math.random()*26;
    }
    nc.putImageData(img,0,0); return n;
  }
  function buildBase(){
    noiseTile=makeNoiseTile();
    const SS=2.1;
    base=document.createElement('canvas');
    base.width=WORLD.w*SS; base.height=WORLD.h*SS;
    const b=base.getContext('2d'); b.scale(SS,SS);
    const sun={dx:-0.6,dy:-0.8}; // light from upper-left

    // 1. rough base (whole field)
    const rg=b.createLinearGradient(0,0,0,WORLD.h);
    rg.addColorStop(0,'#4a7a3b'); rg.addColorStop(.5,'#3f6b32'); rg.addColorStop(1,'#355c2a');
    b.fillStyle=rg; b.fillRect(0,0,WORLD.w,WORLD.h);
    // rough mottling
    b.save();
    for(let i=0;i<520;i++){
      const x=Math.random()*WORLD.w, y=Math.random()*WORLD.h, r=30+Math.random()*90;
      b.globalAlpha=0.05+Math.random()*0.06;
      b.fillStyle=Math.random()>.5?'#4d7f3d':'#2f5326';
      b.beginPath(); b.ellipse(x,y,r,r*0.7,Math.random()*3,0,7); b.fill();
    }
    b.restore();
    // grass grain
    tilePattern(b,0,0,WORLD.w,WORLD.h,0.5);

    // 2. cart path (concrete) — under grass edges, above rough
    b.save();
    b.lineCap='round'; b.lineJoin='round';
    b.strokeStyle='rgba(20,30,18,.22)'; b.lineWidth=CARTW+16; b.stroke(cartPath); // AO edge
    const cg=b.createLinearGradient(0,150,0,250);
    cg.addColorStop(0,'#d7d2c4'); cg.addColorStop(.5,'#c9c3b3'); cg.addColorStop(1,'#b9b3a2');
    b.strokeStyle=cg; b.lineWidth=CARTW; b.stroke(cartPath);
    // expansion joints
    b.strokeStyle='rgba(120,116,104,.55)'; b.lineWidth=2;
    b.setLineDash([2,54]); b.stroke(cartPath); b.setLineDash([]);
    // subtle centre wear
    b.strokeStyle='rgba(255,255,255,.10)'; b.lineWidth=CARTW*0.5; b.stroke(cartPath);
    b.restore();

    // 3. left pond + right water (static base; shimmer added live)
    drawWaterBase(b,pondL);
    drawWaterBase(b,waterR);

    // 4. fairway corridor with first-cut collar + mow stripes
    b.save();
    b.lineCap='round'; b.lineJoin='round';
    b.strokeStyle='rgba(18,30,14,.16)'; b.lineWidth=FAIRW+30; b.stroke(fairwayPath); // soft AO edge
    const fCollar=b.createLinearGradient(0,0,0,WORLD.h);
    fCollar.addColorStop(0,'#5b8f42'); fCollar.addColorStop(1,'#4f7f39');
    b.strokeStyle=fCollar; b.lineWidth=FAIRW+18; b.stroke(fairwayPath);   // first cut
    const fg=b.createLinearGradient(0,0,0,WORLD.h);
    fg.addColorStop(0,'#72b154'); fg.addColorStop(1,'#65a049');
    b.strokeStyle=fg; b.lineWidth=FAIRW; b.stroke(fairwayPath);           // fairway
    // clip to fairway region → diagonal mow stripes + grain
    b.save();
    b.clip(strokeToRegion(fairwayPath,FAIRW));
    for(let i=-8;i<46;i++){
      b.globalAlpha=0.085; b.fillStyle=i%2?'#7fc460':'#5b9042';
      b.beginPath();
      const yy=i*66;
      b.moveTo(-200,yy); b.lineTo(WORLD.w+200,yy-300);
      b.lineTo(WORLD.w+200,yy-300+33); b.lineTo(-200,yy+33); b.closePath(); b.fill();
    }
    b.globalAlpha=0.45; b.fillStyle=b.createPattern(noiseTile,'repeat'); b.fillRect(0,0,WORLD.w,WORLD.h);
    b.restore();
    b.restore();

    // 5. bunker (sand)
    drawSand(b,bunker);

    // 6. green (putting surface)
    drawGreen(b,green);

    // 7. tee box
    drawTee(b,tee);

    // 8. trees (painter order)
    for(const t of trees) drawTree(b,t);

    // 9. tee sign post + subtle site vignette baked lightly
    drawSign(b, tee.x+52, tee.y-30, '1');

    function tilePattern(g,x,y,w,h,alpha){
      const pat=g.createPattern(noiseTile,'repeat');
      g.save(); g.globalAlpha=alpha; g.fillStyle=pat; g.fillRect(x,y,w,h); g.restore();
    }
  }

  // build a clip region approximating a thick stroke (sample the path)
  function strokeToRegion(path,width){
    // fallback: use the same path stroked into a Path2D isn't available; emulate by clipping to stroke via canvas
    // We approximate with the fairway polygon offset — good enough for stripe clipping.
    const p=new Path2D();
    const pts=fairwayPts, half=width/2;
    const left=[], right=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
      let nx=-(b[1]-a[1]), ny=(b[0]-a[0]); const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l;
      left.push([pts[i][0]+nx*half, pts[i][1]+ny*half]);
      right.push([pts[i][0]-nx*half, pts[i][1]-ny*half]);
    }
    const all=left.concat(right.reverse());
    p.moveTo(all[0][0],all[0][1]);
    for(let i=1;i<all.length;i++) p.lineTo(all[i][0],all[i][1]);
    p.closePath(); return p;
  }

  function drawWaterBase(b,e){
    b.save();
    // AO / shoreline shadow
    b.fillStyle='rgba(12,24,20,.30)';
    b.beginPath(); b.ellipse(e.x,e.y,e.rx+10,e.ry+10,0,0,7); b.fill();
    // sandy shore ring
    b.fillStyle='#cdbd8e';
    b.beginPath(); b.ellipse(e.x,e.y,e.rx+4,e.ry+4,0,0,7); b.fill();
    // water body
    const g=b.createRadialGradient(e.x-e.rx*.3,e.y-e.ry*.3,10,e.x,e.y,Math.max(e.rx,e.ry));
    g.addColorStop(0,'#3ca7bd'); g.addColorStop(.55,'#227e93'); g.addColorStop(1,'#12586b');
    b.fillStyle=g;
    b.beginPath(); b.ellipse(e.x,e.y,e.rx,e.ry,0,0,7); b.fill();
    // depth core
    b.globalAlpha=.35; b.fillStyle='#0e4658';
    b.beginPath(); b.ellipse(e.x+e.rx*.12,e.y+e.ry*.14,e.rx*.55,e.ry*.55,0,0,7); b.fill();
    b.restore();
  }
  function drawSand(b,e){
    b.save();
    b.fillStyle='rgba(15,25,14,.28)';
    b.beginPath(); b.ellipse(e.x,e.y,e.rx+8,e.ry+8,-.2,0,7); b.fill();
    const g=b.createRadialGradient(e.x-e.rx*.3,e.y-e.ry*.4,6,e.x,e.y,e.rx);
    g.addColorStop(0,'#f0e2b8'); g.addColorStop(.7,'#e3cf9c'); g.addColorStop(1,'#ccb47e');
    b.fillStyle=g;
    b.beginPath(); b.ellipse(e.x,e.y,e.rx,e.ry,-.2,0,7); b.fill();
    // rake arcs
    b.strokeStyle='rgba(180,158,110,.5)'; b.lineWidth=1.4;
    for(let i=1;i<5;i++){ b.beginPath(); b.ellipse(e.x,e.y,e.rx*(i/5),e.ry*(i/5),-.2,0,7); b.stroke(); }
    // grain
    b.globalAlpha=.5;
    for(let i=0;i<160;i++){ const a=Math.random()*7,rr=Math.random();
      const x=e.x+Math.cos(a)*e.rx*rr*.96, y=e.y+Math.sin(a)*e.ry*rr*.96;
      b.fillStyle=Math.random()>.5?'#fff6dc':'#b79c68'; b.globalAlpha=.18;
      b.fillRect(x,y,1.4,1.4);
    }
    b.restore();
  }
  function drawGreen(b,e){
    b.save();
    b.fillStyle='rgba(12,26,12,.34)';
    b.beginPath(); b.ellipse(e.x+6,e.y+8,e.r+10,e.r*0.92+10,0,0,7); b.fill();
    const g=b.createRadialGradient(e.x-e.r*.3,e.y-e.r*.4,8,e.x,e.y,e.r);
    g.addColorStop(0,'#93d873'); g.addColorStop(.7,'#7ec95e'); g.addColorStop(1,'#66ac49');
    b.fillStyle=g;
    b.beginPath(); b.ellipse(e.x,e.y,e.r,e.r*0.92,0,0,7); b.fill();
    // fine stripes
    b.save(); b.beginPath(); b.ellipse(e.x,e.y,e.r,e.r*0.92,0,0,7); b.clip();
    for(let i=-6;i<6;i++){ b.globalAlpha=.08; b.fillStyle=i%2?'#8fd76c':'#6cb551';
      b.fillRect(e.x-e.r+i*22,e.y-e.r,14,e.r*2); }
    b.restore();
    // collar
    b.globalAlpha=.5; b.strokeStyle='#5f9a44'; b.lineWidth=4;
    b.beginPath(); b.ellipse(e.x,e.y,e.r,e.r*0.92,0,0,7); b.stroke();
    b.restore();
  }
  function drawTee(b,t){
    b.save();
    b.fillStyle='rgba(12,24,12,.3)';
    rrect(b,t.x-4,t.y+4,t.w+8,t.h+6,10); b.fill();
    const g=b.createLinearGradient(0,t.y,0,t.y+t.h);
    g.addColorStop(0,'#74b357'); g.addColorStop(1,'#5f9a46');
    b.fillStyle=g; rrect(b,t.x,t.y,t.w,t.h,9); b.fill();
    b.fillStyle='#e9eef0'; b.beginPath(); b.arc(t.x+t.w*0.32,t.y+t.h*0.5,4,0,7); b.fill();
    b.fillStyle='#e03b3b'; b.beginPath(); b.arc(t.x+t.w*0.68,t.y+t.h*0.5,4,0,7); b.fill();
    b.restore();
  }
  function drawSign(b,x,y,txt){
    b.save();
    b.strokeStyle='#6b4a2c'; b.lineWidth=4; b.beginPath(); b.moveTo(x,y); b.lineTo(x,y+44); b.stroke();
    b.fillStyle='#173a24'; rrect(b,x-16,y-20,52,26,5); b.fill();
    b.strokeStyle='rgba(255,255,255,.5)'; b.lineWidth=1; rrect(b,x-16,y-20,52,26,5); b.stroke();
    b.fillStyle='#eaf5ea'; b.font='bold 15px sans-serif'; b.textAlign='center'; b.textBaseline='middle';
    b.fillText('♂ '+txt, x+10, y-6);
    b.restore();
  }
  function drawTree(b,t){
    const s=t.r;
    // shadow toward lower-right (sun upper-left)
    b.save();
    b.fillStyle='rgba(18,30,14,.30)';
    b.beginPath(); b.ellipse(t.x+s*0.5,t.y+s*0.62,s*1.05,s*0.6,0,0,7); b.fill();
    // canopy layered
    const base = t.tone>.5? '#2f5a2a':'#335f2b';
    b.fillStyle=base; b.beginPath(); b.arc(t.x,t.y,s,0,7); b.fill();
    b.fillStyle='#3f7a37'; b.beginPath(); b.arc(t.x-s*0.12,t.y-s*0.14,s*0.82,0,7); b.fill();
    // scalloped texture
    b.fillStyle='#4a8c40';
    for(let k=0;k<5;k++){ const a=k/5*Math.PI*2; b.beginPath();
      b.arc(t.x+Math.cos(a)*s*0.5,t.y+Math.sin(a)*s*0.5,s*0.34,0,7); b.fill(); }
    // highlight
    b.fillStyle='#63ab55'; b.beginPath(); b.arc(t.x-s*0.3,t.y-s*0.32,s*0.4,0,7); b.fill();
    b.restore();
  }
  function rrect(g,x,y,w,h,r){ g.beginPath();
    g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

  /* ---------- camera ---------- */
  let view={cx:700,cy:855,w:2180};
  const HOME={cx:700,cy:855,w:2180};
  let S=1,tx=0,ty=0;
  function applyView(){
    S=CW/view.w;
    tx=CW/2 - view.cx*S;
    ty=CH/2 - view.cy*S;
  }
  // rasterise the static scene (backdrop + base map + vignette) once per camera position
  function renderStatic(){
    sctx.setTransform(1,0,0,1,0,0);
    sctx.clearRect(0,0,CW,CH);
    sctx.fillStyle=backdropGrad; sctx.fillRect(0,0,CW,CH);
    sctx.setTransform(S,0,0,S,tx,ty);
    sctx.imageSmoothingEnabled=true; sctx.imageSmoothingQuality='high';
    sctx.drawImage(base,0,0,WORLD.w,WORLD.h);
    sctx.setTransform(1,0,0,1,0,0);
    sctx.fillStyle=vignetteGrad; sctx.fillRect(0,0,CW,CH);
  }
  function toWorld(px,py){ return { x:(px*DPR - tx)/S, y:(py*DPR - ty)/S }; }

  /* ---------- flyover ---------- */
  const legs=[
    {cx:700, cy:855, w:2180, label:'Hole 1 · Par 5 · dogleg right', hold:1.1, dur:0.1},
    {cx:360, cy:500, w:700,  label:'The tee — aim down the left', hold:1.0, dur:2.6},
    {cx:560, cy:720, w:900,  label:'Water off the tee', hold:.9, dur:2.6},
    {cx:660, cy:1200,w:900,  label:'The bottom of the dogleg', hold:.9, dur:2.6},
    {cx:1040,cy:940, w:1000, label:'Water guards the right', hold:.9, dur:2.6},
    {cx:1120,cy:410, w:640,  label:'Approach — bunker front-left of the green', hold:1.3, dur:2.6},
    {cx:700, cy:855, w:2180, label:'', hold:.6, dur:2.4}
  ];
  let flying=false, flyT=0, flyLeg=0, flyStart=null;
  const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function startFly(){
    if(flying){ stopFly(); return; }
    flying=true; flyLeg=0; flyT=0; flyStart={...view};
    document.getElementById('flyBtn').classList.add('active');
    document.getElementById('progress').classList.add('show');
    document.getElementById('flylabel').classList.add('show');
  }
  function stopFly(){
    flying=false;
    document.getElementById('flyBtn').classList.remove('active');
    document.getElementById('progress').classList.remove('show');
    document.getElementById('flylabel').classList.remove('show');
  }
  function stepFly(dt){
    const leg=legs[flyLeg];
    const total=leg.hold+leg.dur;
    flyT+=dt;
    const from = flyLeg===0? flyStart : legs[flyLeg-1];
    const p = Math.min(1, Math.max(0,(flyT-0)/ (leg.dur||0.001)));
    const e = easeIO(Math.min(1,p));
    view.cx = from.cx+(leg.cx-from.cx)*e;
    view.cy = from.cy+(leg.cy-from.cy)*e;
    view.w  = from.w +(leg.w -from.w )*e;
    document.getElementById('flylabel').textContent=leg.label||legs[Math.max(0,flyLeg-1)].label;
    const done=(flyLeg + Math.min(1,flyT/total))/legs.length;
    document.getElementById('bar').style.width=(done*100)+'%';
    if(flyT>=total){ flyT=0; flyLeg++; if(flyLeg>=legs.length){ stopFly(); document.getElementById('bar').style.width='0%'; } }
  }

  /* ---------- ideal line + ball ---------- */
  let showLine=false, ballT=0;
  const linePts = [[tee.x+tee.w*0.5,tee.y+tee.h*0.5]].concat(fairwayPts.slice(1)).concat([[pin.x,pin.y]]);
  function ptOnPoly(pl,t){
    const seg=(pl.length-1)*t; const i=Math.min(pl.length-2,Math.floor(seg)); const f=seg-i;
    return [pl[i][0]+(pl[i+1][0]-pl[i][0])*f, pl[i][1]+(pl[i+1][1]-pl[i][1])*f];
  }

  /* ---------- cart animation on click ---------- */
  let cartAnim=null; // {t}
  function driveCart(){
    cartAnim={t:0};
    banner.classList.add('show');
    clearTimeout(driveCart._to);
    driveCart._to=setTimeout(()=>banner.classList.remove('show'),3600);
  }

  /* ---------- hit testing ---------- */
  const ht=document.createElement('canvas').getContext('2d');
  function hitTest(wx,wy){
    // priority: cart path, green, pin, bunker, waters, tee, fairway, trees
    ht.lineWidth=CARTW; if(ht.isPointInStroke(cartPath,wx,wy))
      return {key:'cart', t:'Cart path', s:'Click to travel to Hole 2 →'};
    if(dist(wx,wy,green.x,green.y)<green.r)
      return {key:'green', t:'The green', s:'541 yds · slight back-to-front'};
    if(inEllipse(wx,wy,bunker)) return {key:'bunker', t:'Greenside bunker', s:'Sand · front-left of green'};
    if(inEllipse(wx,wy,pondL)) return {key:'pondL', t:'Water hazard', s:'Left of the tee landing'};
    if(inEllipse(wx,wy,waterR)) return {key:'waterR', t:'Water hazard', s:'Runs down the right side'};
    if(wx>tee.x&&wx<tee.x+tee.w&&wy>tee.y&&wy<tee.y+tee.h)
      return {key:'tee', t:'Tee — Hole 1', s:'Par 5 · dogleg right'};
    ht.lineWidth=FAIRW; if(ht.isPointInStroke(fairwayPath,wx,wy))
      return {key:'fairway', t:'Fairway', s:'Mowed corridor · bends right'};
    for(const tr of trees) if(dist(wx,wy,tr.x,tr.y)<tr.r+3)
      return {key:'trees', t:'Trees / rough', s:'Line both sides of the hole'};
    return null;
  }

  /* ---------- dynamic overlays ---------- */
  function drawDynamic(now){
    const t=now/1000;
    // water shimmer
    shimmer(pondL,t); shimmer(waterR,t);
    // hover highlight
    if(hovered) highlight(hovered);
    // ideal line + ball
    if(showLine){
      ctx.save();
      ctx.setLineDash([3,10]); ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=3.4/1;
      ctx.beginPath(); ctx.moveTo(linePts[0][0],linePts[0][1]);
      for(let i=1;i<linePts.length;i++) ctx.lineTo(linePts[i][0],linePts[i][1]);
      ctx.stroke(); ctx.setLineDash([]);
      // markers
      [0.33,0.66].forEach((tt,i)=>{ const p=ptOnPoly(linePts,tt);
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.arc(p[0],p[1],13,0,7); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(i===0?'250':'480',p[0],p[1]); });
      // ball
      ballT=(ballT+0.0016)%1;
      const bp=ptOnPoly(linePts, easeIO(ballT));
      const bs=8;
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(bp[0]+2,bp[1]+3,bs,bs*.7,0,0,7); ctx.fill();
      const bg=ctx.createRadialGradient(bp[0]-3,bp[1]-3,1,bp[0],bp[1],bs);
      bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#c9d2cb');
      ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(bp[0],bp[1],bs,0,7); ctx.fill();
      ctx.restore();
    }
    // flag (waving)
    drawFlag(t);
    // cart driving
    if(cartAnim){
      cartAnim.t+=0.006; if(cartAnim.t>=1){ cartAnim=null; }
      else{
        const p=ptOnPoly(cartPts.map(p=>[p[0],p[1]]), cartAnim.t);
        ctx.save();
        ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p[0]+3,p[1]+8,16,7,0,0,7); ctx.fill();
        ctx.fillStyle='#f4f3ee'; rrect(ctx,p[0]-15,p[1]-13,30,20,4); ctx.fill();
        ctx.fillStyle='#2f7d43'; rrect(ctx,p[0]-15,p[1]-13,30,8,4); ctx.fill();
        ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(p[0]-8,p[1]+8,4,0,7); ctx.arc(p[0]+8,p[1]+8,4,0,7); ctx.fill();
        ctx.restore();
      }
    }
  }
  function shimmer(e,t){
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e.x,e.y,e.rx,e.ry,0,0,7); ctx.clip();
    ctx.globalAlpha=.5; ctx.strokeStyle='rgba(200,240,248,.55)'; ctx.lineWidth=2;
    for(let i=0;i<6;i++){
      const yy=e.y-e.ry + ( (t*26 + i*e.ry*0.34) % (e.ry*2) );
      ctx.beginPath();
      for(let x=-e.rx;x<=e.rx;x+=12){
        const y=yy + Math.sin((x*0.05)+(t*2)+i)*4;
        x===-e.rx?ctx.moveTo(e.x+x,y):ctx.lineTo(e.x+x,y);
      }
      ctx.globalAlpha=0.10+0.06*Math.sin(t*2+i); ctx.stroke();
    }
    // sun glint
    ctx.globalAlpha=.18; ctx.fillStyle='#eafaff';
    ctx.beginPath(); ctx.ellipse(e.x-e.rx*.3,e.y-e.ry*.3,e.rx*.4,e.ry*.22,0.5,0,7); ctx.fill();
    ctx.restore();
  }
  function drawFlag(t){
    const gx=pin.x, gy=pin.y;
    ctx.save();
    // pole shadow
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(gx+3,gy+3); ctx.lineTo(gx+3+8,gy+3+30); ctx.stroke();
    // cup
    ctx.fillStyle='#20331f'; ctx.beginPath(); ctx.ellipse(gx,gy,5,3.4,0,0,7); ctx.fill();
    // pole
    ctx.strokeStyle='#f2f2ee'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx,gy-42); ctx.stroke();
    // flag waving
    ctx.fillStyle='#e8443a';
    ctx.beginPath(); ctx.moveTo(gx,gy-42);
    const w=26,h=15;
    for(let i=0;i<=w;i+=2){ const yy=gy-42 + (i/w)*0 + Math.sin(i*0.4 + t*6)*2.2*(i/w);
      ctx.lineTo(gx+i, yy+ (i/w)* (Math.sin(t*6)*0) ); }
    ctx.lineTo(gx+w, gy-42+h+Math.sin(t*6)*2);
    for(let i=w;i>=0;i-=2){ const yy=gy-42+h + Math.sin(i*0.4 + t*6)*2.2*(i/w);
      ctx.lineTo(gx+i, yy); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function highlight(h){
    ctx.save();
    ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.shadowColor='rgba(255,255,255,.7)'; ctx.shadowBlur=10;
    if(h.key==='green'){ ctx.beginPath(); ctx.ellipse(green.x,green.y,green.r,green.r*.92,0,0,7); ctx.stroke(); }
    else if(h.key==='bunker'){ ctx.beginPath(); ctx.ellipse(bunker.x,bunker.y,bunker.rx,bunker.ry,-.2,0,7); ctx.stroke(); }
    else if(h.key==='pondL'){ ctx.beginPath(); ctx.ellipse(pondL.x,pondL.y,pondL.rx,pondL.ry,0,0,7); ctx.stroke(); }
    else if(h.key==='waterR'){ ctx.beginPath(); ctx.ellipse(waterR.x,waterR.y,waterR.rx,waterR.ry,0,0,7); ctx.stroke(); }
    else if(h.key==='tee'){ rrect(ctx,tee.x,tee.y,tee.w,tee.h,9); ctx.stroke(); }
    else if(h.key==='cart'){ ctx.lineWidth=CARTW; ctx.globalAlpha=.22; ctx.strokeStyle='#fff'; ctx.stroke(cartPath);
      ctx.globalAlpha=1; ctx.lineWidth=3; ctx.setLineDash([6,8]); ctx.strokeStyle='#fff'; ctx.stroke(cartPath); ctx.setLineDash([]); }
    else if(h.key==='fairway'){ ctx.lineWidth=FAIRW; ctx.globalAlpha=.14; ctx.strokeStyle='#fff'; ctx.stroke(fairwayPath); }
    else if(h.key==='trees'){ /* soft ring on nearest cluster - skip heavy */ }
    ctx.restore();
  }
  function drawLabels(){
    if(!labelsOn) return;
    const items=[
      [tee.x+tee.w/2, tee.y-26,'TEE'],
      [pondL.x, pondL.y,'WATER'],
      [waterR.x, waterR.y,'WATER'],
      [bunker.x, bunker.y,'SAND'],
      [green.x, green.y+green.r+22,'GREEN'],
      [720,906,'TREES'],
      [640,168,'CART PATH → HOLE 2']
    ];
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const [x,y,txt] of items){
      ctx.font='700 '+Math.max(13, 15)+'px sans-serif';
      const w=ctx.measureText(txt).width+16;
      ctx.fillStyle='rgba(8,14,11,.6)'; rrect(ctx,x-w/2,y-11,w,22,7); ctx.fill();
      ctx.fillStyle='#eaf4ec'; ctx.fillText(txt,x,y);
    }
    ctx.restore();
  }

  /* ---------- main loop ---------- */
  let hovered=null, labelsOn=true, last=0;
  function frame(now){
    if(!last) last=now; const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(flying) stepFly(dt);
    applyView();
    // only re-rasterise the static scene when the camera actually moved / resized
    const vk=view.cx.toFixed(1)+'|'+view.cy.toFixed(1)+'|'+view.w.toFixed(1)+'|'+CW+'|'+CH;
    if(vk!==lastViewKey){ renderStatic(); lastViewKey=vk; }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(sc,0,0);                 // cheap same-size blit
    ctx.setTransform(S,0,0,S,tx,ty);
    drawDynamic(now);
    drawLabels();
    requestAnimationFrame(frame);
  }

  /* ---------- events ---------- */
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    CW=Math.floor(cv.clientWidth*DPR); CH=Math.floor(cv.clientHeight*DPR);
    cv.width=CW; cv.height=CH;
    sc.width=CW; sc.height=CH;
    backdropGrad=sctx.createLinearGradient(0,0,0,CH);
    backdropGrad.addColorStop(0,'#243f2c'); backdropGrad.addColorStop(1,'#152417');
    vignetteGrad=sctx.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*0.35,CW/2,CH/2,Math.max(CW,CH)*0.72);
    vignetteGrad.addColorStop(0,'rgba(0,0,0,0)'); vignetteGrad.addColorStop(1,'rgba(0,0,0,.42)');
    lastViewKey='';
  }
  window.addEventListener('resize', resize);

  cv.addEventListener('mousemove', e=>{
    const r=cv.getBoundingClientRect();
    const w=toWorld(e.clientX-r.left, e.clientY-r.top);
    hovered=hitTest(w.x,w.y);
    if(hovered){
      cv.classList.add('hovering');
      tip.querySelector('.t').textContent=hovered.t;
      tip.querySelector('.s').textContent=hovered.s;
      tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
      tip.classList.add('show');
    } else { cv.classList.remove('hovering'); tip.classList.remove('show'); }
  });
  cv.addEventListener('mouseleave', ()=>{ hovered=null; tip.classList.remove('show'); cv.classList.remove('hovering'); });
  cv.addEventListener('click', e=>{
    const r=cv.getBoundingClientRect();
    const w=toWorld(e.clientX-r.left, e.clientY-r.top);
    const h=hitTest(w.x,w.y);
    if(h&&h.key==='cart') driveCart();
  });

  document.getElementById('flyBtn').addEventListener('click', startFly);
  document.getElementById('resetBtn').addEventListener('click', ()=>{ stopFly(); view={...HOME}; });
  document.getElementById('lineBtn').addEventListener('click', function(){
    showLine=!showLine; this.classList.toggle('active',showLine);
  });
  document.getElementById('labelBtn').addEventListener('click', function(){
    labelsOn=!labelsOn; this.classList.toggle('active',labelsOn);
  });

  /* ---------- boot ---------- */
  resize();
  buildTrees();
  buildBase();
  requestAnimationFrame(frame);
  // expose for headless verification
  window.__setView=(v)=>{ Object.assign(view,v); };
  window.__ready=true;
})();
</script>
</body>
</html>
