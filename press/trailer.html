<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05100a;overflow:hidden}
  .stage{position:relative;overflow:hidden;background:#05100a;
         font-family:'Avenir Next','Helvetica Neue',system-ui,sans-serif}
  .layer{position:absolute;inset:0}
  .t3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
       white-space:nowrap;font-weight:800;letter-spacing:-.03em;line-height:.9;
       text-align:center}
  .t3d span{display:block;position:relative}
  /* The FRONT face stays in normal flow — it is what gives the line its
     width and height. Every extrusion layer behind it is absolute and
     therefore contributes no size. Making them all absolute collapsed each
     line to zero, so the two lines piled on top of each other and the whole
     block lost its centring. */
  .t3d b{display:block;position:relative;font-weight:800}
  .t3d i{position:absolute;left:0;top:0;width:100%;font-style:normal}
</style>
<div id="out"></div>
<script>
const P=new URLSearchParams(location.search);
const W=+P.get('w')||1280, H=+P.get('h')||720;
const DUR=+P.get('dur')||5.6;
const strip=P.get('strip');            // "start,count,fps" -> render frames as a column
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeIn=t=>{t=clamp(t,0,1);return t*t;};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};

/* ── the beats ─────────────────────────────────────────────────────────────
   Deliberately short. A store trailer is watched with the sound off by
   somebody deciding in two seconds whether to click, so the ball is already
   in the air on frame one and the hole is done by three. */
const T_FLY=2.25, T_HOP=2.62, T_IN=3.00, T_HOLD=3.55, T_RISE=5.6;

function scene(t){
  const el=document.createElement('div');
  el.className='stage'; el.style.width=W+'px'; el.style.height=H+'px';

  /* The camera is one number: how far we have risen. Everything else is
     derived from it, so the climb cannot desynchronise from the sky. */
  const rise = ease((t-T_HOLD)/(T_RISE-T_HOLD));
  const horizon = H*lerp(0.42, 1.35, rise);        // pushed off the bottom as we climb
  const zoom = lerp(1, 0.55, rise);

  // sky darkens and deepens as we go up
  const skyTop = ['#5d97c4','#2f5f92','#12294d','#0a1730'];
  const kSky = rise*3;
  const i0=clamp(Math.floor(kSky),0,2), f=kSky-i0;
  const mix=(a,b,f)=>{const p=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
    const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],f)).toString(16).padStart(2,'0')).join('');};
  const sky = mix(skyTop[i0], skyTop[i0+1], f);

  const vx=W*0.5;
  let svg=`<svg class="layer" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${sky}"/>
        <stop offset="100%" stop-color="${mix(sky,'#cfe3ea',0.55*(1-rise))}"/></linearGradient>
      <linearGradient id="tf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4f9350"/><stop offset="100%" stop-color="#2b6234"/></linearGradient>
      <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(3,12,8,.55)"/><stop offset="45%" stop-color="rgba(3,12,8,0)"/>
        <stop offset="100%" stop-color="rgba(3,12,8,.78)"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#sk)"/>`;

  // stars appear once we are high enough — the reward for the climb
  if (rise>0.35){
    let s=99991; const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
    const a=clamp((rise-0.35)/0.5,0,1);
    for(let i=0;i<90;i++){
      const x=r()*W, y=r()*H*0.7, rad=0.6+r()*1.5;
      svg+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="rgba(255,255,255,${(a*(0.25+r()*0.6)).toFixed(2)})"/>`;
    }
  }

  if (horizon < H*1.3){
    // ridges
    let s=4242; const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
    const band=(y,amp,fill,seg)=>{let d=`M0 ${H} L0 ${y}`;
      for(let x=0;x<=W;x+=seg) d+=` L${x} ${(y+(r()-0.5)*amp).toFixed(1)}`;
      return `<path d="${d} L${W} ${H} Z" fill="${fill}"/>`;};
    svg+=band(horizon-H*0.075,H*0.05,'#6f93a6',W/9);
    svg+=band(horizon-H*0.030,H*0.035,'#4d7a5f',W/12);
    svg+=`<rect x="0" y="${horizon}" width="${W}" height="${H-horizon+2}" fill="url(#tf)"/>`;

    // the hole, tapering to the horizon
    const near=H*1.02, halfN=W*0.60*zoom, halfF=W*0.030*zoom;
    svg+=`<path d="M${vx-halfF} ${horizon} L${vx+halfF} ${horizon} L${vx+halfN} ${near} L${vx-halfN} ${near} Z" fill="#63a955"/>`;
    for(let i=0;i<6;i++){const a=i/6,b=(i+0.5)/6;
      if(i%2) svg+=`<path d="M0 ${horizon+(near-horizon)*a*a} L${W} ${horizon+(near-horizon)*a*a}
        L${W} ${horizon+(near-horizon)*b*b} L0 ${horizon+(near-horizon)*b*b} Z" fill="rgba(255,255,255,.05)"/>`;}

    // green complex
    const gy=horizon+(H-horizon)*0.30*zoom, gr=W*0.20*zoom;
    svg+=`<ellipse cx="${vx-gr*1.2}" cy="${gy+H*0.035*zoom}" rx="${gr*0.55}" ry="${H*0.022*zoom}" fill="#e0cb96"/>`;
    svg+=`<ellipse cx="${vx+gr*1.05}" cy="${gy+H*0.012*zoom}" rx="${gr*0.42}" ry="${H*0.018*zoom}" fill="#e0cb96"/>`;
    svg+=`<ellipse cx="${vx}" cy="${gy}" rx="${gr}" ry="${H*0.062*zoom}" fill="#82cf62"/>`;
    svg+=`<circle cx="${vx}" cy="${gy}" r="${Math.max(2,W*0.007*zoom)}" fill="#14240f"/>`;

    // flag, with a kick when the ball drops
    const fh=H*0.15*zoom;
    const kick = t>T_IN && t<T_IN+0.55 ? Math.sin((t-T_IN)*22)*Math.exp(-(t-T_IN)*7)*0.22 : 0;
    svg+=`<g transform="translate(${vx} ${gy}) rotate(${(kick*30).toFixed(2)})">
      <rect x="-2" y="${-fh}" width="4" height="${fh}" fill="#f6f8f5"/>
      <path d="M2 ${-fh} L${W*0.055*zoom} ${-fh*0.83} L2 ${-fh*0.66} Z" fill="#e0483c"/></g>`;

    /* THE SHOT. Two arcs: the flight, then a low hop into the cup — which is
       what makes it read as golf rather than as a ball being lowered onto a
       target. */
    let bx,by,vis=t<T_IN+0.1;
    if (t<T_FLY){ const k=easeOut(t/T_FLY);
      bx=lerp(vx-W*0.30, vx, k); by=lerp(H*1.05, gy, k) - Math.sin(k*Math.PI)*H*0.46; }
    else if (t<T_HOP){ const k=(t-T_FLY)/(T_HOP-T_FLY);
      bx=lerp(vx, vx+W*0.035, k); by=gy - Math.sin(k*Math.PI)*H*0.055; }
    else { const k=clamp((t-T_HOP)/(T_IN-T_HOP),0,1);
      bx=lerp(vx+W*0.035, vx, k); by=gy - Math.sin(k*Math.PI)*H*0.022 + easeIn(k)*H*0.012; }

    // tracer, drawn only as far as the ball has flown
    if (t<T_IN+0.9){
      const n=26, a=clamp(1-(t-T_IN)/0.9,0,1); let d='';
      for(let i=0;i<=n;i++){ const tt=Math.min(t,T_FLY)*i/n, k=easeOut(tt/T_FLY);
        const px=lerp(vx-W*0.30,vx,k), py=lerp(H*1.05,gy,k)-Math.sin(k*Math.PI)*H*0.46;
        d+=(i?' L':'M')+px.toFixed(1)+' '+py.toFixed(1); }
      svg+=`<path d="${d}" fill="none" stroke="rgba(255,255,255,${(0.85*a).toFixed(2)})"
             stroke-width="${Math.max(2,W*0.0028)}" stroke-linecap="round"
             stroke-dasharray="${W*0.012} ${W*0.010}"/>`;
    }
    if (vis) svg+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${Math.max(4,W*0.0075*zoom)}" fill="#fff"/>`;

    // the drop: a ring of turf and a flash
    if (t>T_IN && t<T_IN+0.7){ const k=(t-T_IN)/0.7;
      svg+=`<circle cx="${vx}" cy="${gy}" r="${(W*0.02+k*W*0.10).toFixed(1)}" fill="none"
             stroke="rgba(255,255,255,${(0.55*(1-k)).toFixed(2)})" stroke-width="${(3*(1-k)+1).toFixed(1)}"/>`;
    }
  }
  svg+=`<rect width="${W}" height="${H}" fill="url(#vg)"/></svg>`;
  el.innerHTML=svg;

  /* ── HOLE IN ONE ─────────────────────────────────────────────────────── */
  if (t>T_IN && t<T_HOLD+0.5){
    const k=clamp((t-T_IN)/0.35,0,1), out=clamp((t-(T_HOLD+0.1))/0.4,0,1);
    const sc=lerp(0.7,1,easeOut(k))*lerp(1,1.12,out);
    const lab=document.createElement('div');
    lab.style.cssText=`position:absolute;left:50%;top:${H*0.30}px;transform:translate(-50%,-50%) scale(${sc});
      opacity:${(Math.min(k,1-out)).toFixed(2)};color:#fff;font-weight:800;letter-spacing:.02em;
      font-size:${W*0.058}px;text-shadow:0 4px 26px rgba(0,0,0,.7);white-space:nowrap`;
    lab.innerHTML=`<span style="color:#ffd94a">HOLE IN ONE</span>`;
    el.appendChild(lab);
  }

  /* ── THE TITLE, in real 3D ───────────────────────────────────────────────
     Extruded by stacking copies back along Z. It is the cheap trick and it is
     the right one here: a font has no depth, and twenty layers a pixel apart
     read as solid at any size without a modelling package. */
  if (t>T_HOLD){
    const k=ease((t-T_HOLD)/(T_RISE-T_HOLD-0.35));
    const wrap=document.createElement('div');
    wrap.style.cssText=`position:absolute;inset:0;perspective:${W*1.1}px;pointer-events:none`;
    const size=W*0.115;
    const depth=Math.max(10,Math.round(W*0.011));
    const layers=n=>{let s='';
      for(let i=depth;i>0;i--){const g=Math.round(lerp(18,90,i/depth));
        s+=`<i style="transform:translateZ(${-i*1.15}px);color:rgb(${g},${g+18},${g+6})">${n}</i>`;}
      return s;};
    const rotX=lerp(52,0,k), ty=lerp(H*0.34,0,k), sc=lerp(0.72,1,k);
    wrap.innerHTML=`<div class="t3d" style="
        transform:translate(-50%,-50%) translateY(${ty}px) rotateX(${rotX}deg) scale(${sc});
        font-size:${size}px;opacity:${clamp(k*1.6,0,1).toFixed(2)}">
      <span>${layers('LINKS')}<b style="color:#fff;text-shadow:0 0 ${W*0.03}px rgba(120,220,150,.5)">LINKS</b></span>
      <span style="margin-top:${size*0.06}px">${layers('&amp; LEGENDS')}<b
        style="color:#8fe0a4;text-shadow:0 0 ${W*0.03}px rgba(120,220,150,.55)">&amp; LEGENDS</b></span>
    </div>`;
    el.appendChild(wrap);

    if (k>0.55){
      const s=document.createElement('div');
      s.style.cssText=`position:absolute;left:50%;top:${H*0.78}px;transform:translateX(-50%);
        color:#cfeddb;font-weight:700;font-size:${W*0.021}px;letter-spacing:.18em;
        text-transform:uppercase;opacity:${clamp((k-0.55)/0.35,0,1).toFixed(2)}`;
      s.textContent='Free · No sign-up · Play now';
      el.appendChild(s);
    }
  }
  return el;
}

const out=document.getElementById('out');
if (strip){
  const [start,count,fps]=strip.split(',').map(Number);
  for(let i=0;i<count;i++) out.appendChild(scene((start+i)/fps));
} else {
  let el=scene(0); out.appendChild(el);
  const t0=performance.now();
  (function loop(){ const t=((performance.now()-t0)/1000)%(DUR+0.7);
    const n=scene(t); out.replaceChild(n,el); el=n; requestAnimationFrame(loop); })();
}
</script>
